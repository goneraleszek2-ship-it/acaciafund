
theme = "educenter"
baseURL = "https://acaciafund.org/"
title = "AcaciaFund | Daily Research Portfolio"
timeZone = "Europe/Warsaw"
pagination.pagerSize = 10
summaryLength = 20
hasCJKLanguage = false

[outputFormats]
[outputFormats.SEARCH]
baseName = "search"
mediaType = "application/json"
isPlainText = true
notAlternative = true
[outputFormats.STATS]
baseName = "stats"
mediaType = "application/json"
isPlainText = true
notAlternative = true

[outputs]
home = ["HTML", "RSS", "SEARCH"]
section = ["HTML", "RSS"]
taxonomy = ["HTML", "RSS"]
term = ["HTML", "RSS"]

[imaging]
quality = 90
resampleFilter = "lanczos"

[caches]
[caches.images]
dir = ":resourceDir/_gen"
maxAge = "720h"
[caches.assets]
dir = ":resourceDir/_gen"
maxAge = "720h"

[markup]
[markup.goldmark.renderer]
unsafe = true

[params]
logo = "/images/logo.svg"
description = "Codzienna synteza badań — AML, rynki, nauka"
author = "AcaciaFund"
email = "contact@acaciafund.org"
google_analytics_id = ""

[params.preloader]
enable = false

[params.subscription]
enable = false

[params.cookies]
enable = false
expire_days = 2

[[params.plugins.css]]
link = "plugins/bootstrap/bootstrap.min.css"
[[params.plugins.css]]
link = "plugins/animate/animate.css"
[[params.plugins.css]]
link = "plugins/themify-icons/themify-icons.css"

[[params.plugins.js]]
link = "plugins/jQuery/jquery.min.js"
[[params.plugins.js]]
link = "plugins/bootstrap/bootstrap.min.js"
