{{ $prior := .Get "prior" | default "0.5" }}
{{ $like := .Get "like" | default "0.5" }}
<div class="bayes-demo" style="max-width:560px;margin-top:18px;">
  <svg width="260" height="110" viewBox="0 0 260 110" style="border:1px solid #f0f3f7;background:#fff;padding:6px;">
    <g transform="translate(20,10)">
      <path id="priorPath" d="M0,70 Q30,10 60,70" stroke="#0f62fe" stroke-width="3" fill="none" stroke-opacity="0.45"/>
      <path id="likePath" d="M40,70 Q70,5 100,70" stroke="#ff7a59" stroke-width="3" fill="none" stroke-opacity="0.45"/>
      <path id="postPath" d="M20,70 Q55,2 92,70" stroke="#00b894" stroke-width="4" fill="none"/>
    </g>
  </svg>

  <div style="display:flex;gap:12px;margin-top:10px;align-items:center;">
    <label>Prior: <span id="priorLabel">{{ $prior }}</span></label>
    <input id="priorVal" type="range" min="0" max="1" step="0.01" value="{{ $prior }}" style="flex:1;"/>
  </div>
  <div style="display:flex;gap:12px;margin-top:8px;align-items:center;">
    <label>Likelihood: <span id="likeLabel">{{ $like }}</span></label>
    <input id="likeVal" type="range" min="0" max="1" step="0.01" value="{{ $like }}" style="flex:1;"/>
  </div>
  <div style="margin-top:10px;">Posterior: <strong id="posteriorVal">0.5</strong></div>
</div>
