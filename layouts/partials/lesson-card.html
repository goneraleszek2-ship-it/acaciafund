<article class="lesson-card p-4 rounded-lg shadow-sm bg-white max-w-md">
  <h3 class="text-lg font-semibold mb-2"><a href="{{ .RelPermalink }}" class="text-primary">{{ .Title }}</a></h3>
  <div class="text-sm text-gray-500 mb-3">Difficulty: {{ with .Params.difficulty }}{{ . }}{{ end }}</div>
  <p class="text-sm text-gray-700 mb-4">{{ .Summary }}</p>
  <div class="flex gap-3 items-center">
    <a class="inline-block px-4 py-2 border border-primary text-primary rounded-md" href="{{ .RelPermalink }}">Open Lesson</a>
    <button class="inline-block px-4 py-2 bg-primary text-white rounded-md" data-track-lesson="{{ .RelPermalink }}">Mark Done</button>
  </div>
</article>
