{{ define "main" }}

<section class="section">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <h1 class="section-title">{{ .Title }}</h1>
        <p class="text-muted mb-5">{{ len .Pages }} {{ if eq (len .Pages) 1 }}synteza{{ else }}syntez{{ end }}</p>
      </div>
    </div>
    <div class="row">
      {{ range .Paginator.Pages }}
      <div class="col-lg-4 col-sm-6 mb-5">
        {{ .Render "post" }}
      </div>
      {{ end }}
    </div>
    <div class="row">
      <div class="col-12 mt-4">
        {{ template "_internal/pagination.html" . }}
      </div>
    </div>
  </div>
</section>

{{ end }}
