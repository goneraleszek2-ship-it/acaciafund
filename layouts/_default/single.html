<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.7; max-width: 750px; margin: 40px auto; padding: 0 20px; background: #fdfdfd; color: #222; }
        header { border-bottom: 1px solid #ddd; padding-bottom: 10px; margin-bottom: 20px; }
        nav a { margin-right: 15px; color: #222; text-decoration: none; font-size: 0.9em; }
        .meta { color: #666; font-size: 0.9em; margin-bottom: 20px; }
        h2 { margin-top: 35px; border-bottom: 2px solid #222; padding-bottom: 6px; }
        h3 { margin-top: 25px; color: #444; }
        ol, ul { padding-left: 20px; }
        li { margin-bottom: 10px; padding: 8px 12px; background: #f9f9f9; border-left: 3px solid #222; list-style: none; }
        li a { color: #1a1a1a; font-weight: 500; text-decoration: none; }
        li a:hover { text-decoration: underline; }
        hr { border: none; border-top: 1px solid #ddd; margin: 30px 0; }
        blockquote { border-left: 3px solid #ccc; margin: 0; padding: 5px 15px; color: #555; }
        code { background: #eee; padding: 2px 5px; border-radius: 3px; font-size: 0.9em; }
    </style>
</head>
<body>
    <header>
        <nav><a href="/">← Home</a> · <a href="{{ .Parent.RelPermalink }}">↑ {{ .Parent.Title }}</a></nav>
        <h1>{{ .Title }}</h1>
        <div class="meta">📅 {{ .Date.Format "2006-01-02" }} · 🏷️ {{ delimit (default slice .Params.tags) ", " }}</div>
    </header>
    <main>
        {{ .Content }}
    </main>
</body>
</html>
