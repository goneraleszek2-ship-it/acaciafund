<!DOCTYPE html>
<html lang="pl">
<head>{{ partial "head.html" . }}</head>
<body>
    <header>
        <nav>
            <a href="/">🏠 Home</a>
            <a href="{{ .Parent.RelPermalink }}">↑ {{ .Parent.Title }}</a>
            <button data-toggle-dark style="background:none;border:none;cursor:pointer;font-size:1rem;padding:4px 8px;line-height:1;border-radius:20px;transition:.2s" aria-label="Przełącz tryb ciemny">🌙</button>
        </nav>
        <h1>{{ .Title }}</h1>
        <div class="meta">
            📅 {{ .Date.Format "2006-01-02" }}
            {{ range .Params.tags }}<span>{{ . }}</span>{{ end }}
        </div>
    </header>
    <main>{{ .Content }}</main>
    <footer>
        &copy; 2026 Leszek Gonera · AcaciaFund ·
        <a href="/radar/">Radar</a>
    </footer>
    <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js')}</script>
</body>
</html>
