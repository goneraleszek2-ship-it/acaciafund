<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="400" height="225">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="glow" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#052e16" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="225" fill="url(#bg)"/>
  <rect width="400" height="225" fill="url(#glow)"/>

  <!-- Grid -->
  <g stroke="#15803d" stroke-width="0.5" opacity="0.2">
    <line x1="0" y1="50" x2="400" y2="50"/><line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/><line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="225"/><line x1="200" y1="0" x2="200" y2="225"/>
    <line x1="300" y1="0" x2="300" y2="225"/>
  </g>

  <!-- Trend arrow -->
  <g transform="translate(160, 50) scale(1.3)">
    <polyline points="5,25 15,15 25,20 35,5" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="32,3 38,2 37,8" fill="#22c55e"/>
  </g>

  <!-- Bar chart -->
  <g transform="translate(80, 130)">
    <rect x="0" y="30" width="30" height="20" rx="2" fill="#22c55e" opacity="0.5"/>
    <rect x="35" y="15" width="30" height="35" rx="2" fill="#22c55e" opacity="0.7"/>
    <rect x="70" y="5" width="30" height="45" rx="2" fill="#22c55e" opacity="0.9"/>
    <rect x="105" y="20" width="30" height="30" rx="2" fill="#22c55e" opacity="0.6"/>
    <rect x="140" y="10" width="30" height="40" rx="2" fill="#22c55e" opacity="0.8"/>
    <line x1="0" y1="50" x2="180" y2="50" stroke="#15803d" stroke-width="0.5" opacity="0.4"/>
    <!-- Percent labels -->
    <text x="15" y="62" text-anchor="middle" fill="#22c55e" font-family="system-ui,sans-serif" font-size="7" opacity="0.6">40</text>
    <text x="50" y="62" text-anchor="middle" fill="#22c55e" font-family="system-ui,sans-serif" font-size="7" opacity="0.6">70</text>
    <text x="85" y="62" text-anchor="middle" fill="#22c55e" font-family="system-ui,sans-serif" font-size="7" opacity="0.6">90</text>
    <text x="120" y="62" text-anchor="middle" fill="#22c55e" font-family="system-ui,sans-serif" font-size="7" opacity="0.6">60</text>
    <text x="155" y="62" text-anchor="middle" fill="#22c55e" font-family="system-ui,sans-serif" font-size="7" opacity="0.6">80</text>
  </g>

  <text x="200" y="210" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#e2e8f0" letter-spacing="4">MARKETS</text>
</svg>