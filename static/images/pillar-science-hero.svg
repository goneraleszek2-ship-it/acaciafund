<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="sci-hero-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f0f23"/>
    </linearGradient>
    <radialGradient id="sci-hero-glow" cx="50%" cy="50%">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sci-hero-line" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="0.7" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#sci-hero-bg)" rx="8"/>
  <rect width="600" height="300" fill="url(#sci-hero-glow)"/>

  <!-- Orbital paths (atoms) -->
  <ellipse cx="300" cy="140" rx="100" ry="35" fill="none" stroke="#a855f7" stroke-width="0.8" opacity="0.2"/>
  <ellipse cx="300" cy="140" rx="100" ry="35" fill="none" stroke="#c084fc" stroke-width="0.8" opacity="0.15" transform="rotate(60 300 140)"/>
  <ellipse cx="300" cy="140" rx="100" ry="35" fill="none" stroke="#a855f7" stroke-width="0.8" opacity="0.15" transform="rotate(-60 300 140)"/>
  <circle cx="300" cy="140" r="12" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.3"/>
  <circle cx="300" cy="140" r="5" fill="#a855f7" opacity="0.4"/>

  <!-- Electron dots on orbits -->
  <circle cx="400" cy="140" r="3" fill="#c084fc" opacity="0.6"/>
  <circle cx="330" cy="171" r="3" fill="#c084fc" opacity="0.5"/>
  <circle cx="270" cy="171" r="3" fill="#c084fc" opacity="0.5"/>
  <circle cx="240" cy="120" r="2.5" fill="#a855f7" opacity="0.4"/>
  <circle cx="360" cy="120" r="2.5" fill="#a855f7" opacity="0.4"/>

  <!-- DNA helix (right side) -->
  <g opacity="0.15" transform="translate(430, 50)">
    <path d="M20 0 Q50 20 20 40 T20 80 T20 120 T20 160 T20 200" fill="none" stroke="#c084fc" stroke-width="1.2"/>
    <path d="M0 0 Q-30 20 0 40 T0 80 T0 120 T0 160 T0 200" fill="none" stroke="#a855f7" stroke-width="1.2"/>
    <line x1="20" y1="20" x2="0" y2="40" stroke="#6b6a80" stroke-width="0.5"/>
    <line x1="20" y1="60" x2="0" y2="80" stroke="#6b6a80" stroke-width="0.5"/>
    <line x1="20" y1="100" x2="0" y2="120" stroke="#6b6a80" stroke-width="0.5"/>
    <line x1="20" y1="140" x2="0" y2="160" stroke="#6b6a80" stroke-width="0.5"/>
    <line x1="0" y1="20" x2="20" y2="40" stroke="#6b6a80" stroke-width="0.5"/>
    <line x1="0" y1="60" x2="20" y2="80" stroke="#6b6a80" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="20" y2="120" stroke="#6b6a80" stroke-width="0.5"/>
    <line x1="0" y1="140" x2="20" y2="160" stroke="#6b6a80" stroke-width="0.5"/>
  </g>

  <!-- Small particle dots -->
  <g opacity="0.3">
    <circle cx="150" cy="80" r="1.5" fill="#c084fc"/>
    <circle cx="120" cy="180" r="1.5" fill="#a855f7"/>
    <circle cx="180" cy="230" r="1" fill="#c084fc"/>
    <circle cx="450" cy="70" r="1" fill="#a855f7"/>
    <circle cx="480" cy="220" r="1.5" fill="#c084fc"/>
  </g>

  <!-- Vertical accent lines -->
  <line x1="100" y1="230" x2="100" y2="280" stroke="url(#sci-hero-line)" stroke-width="0.5"/>
  <line x1="500" y1="230" x2="500" y2="280" stroke="url(#sci-hero-line)" stroke-width="0.5"/>

  <!-- Bottom accent bar -->
  <rect x="200" y="280" width="200" height="3" rx="1.5" fill="#a855f7" opacity="0.4"/>
  <circle cx="300" cy="281.5" r="3" fill="#a855f7" opacity="0.6"/>
</svg>
