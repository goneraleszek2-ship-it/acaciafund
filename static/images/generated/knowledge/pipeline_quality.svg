@startuml
left to right direction

package "Quality Gates" {
  (Schema Validation - schemas.py Pydantic)
  ("SQI Threshold > 0.65 - configurable in config.py")
  (Domain percent capped at 100)
  (Quality Flags at build time)
}
package "Observability" {
  (Content Counts)
  (Pillar Coverage)
  (SQI Distribution)
  (Bloom Distribution)
  (Tag Coverage)
}
package "CI/CD Cloudflare Pages" {
  (git push main)
FETCH - -> INSTALL
INSTALL - -> GEN
GEN - -> DEPLOY
DEPLOY - -> CACHE
}
GEN - -> SCHEMA
SCHEMA - -> SQI_CK
SQI_CK - -> DOMAIN_CK
DOMAIN_CK - -> FLAG_CK

@enduml

