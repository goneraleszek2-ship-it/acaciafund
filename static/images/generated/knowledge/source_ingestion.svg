@startuml
left to right direction

package "External Sources" {
  (HackerNews API)
  (arXiv API)
  (PubMed)
}
package "Curation Layer" {
  (Manual Curation)
  (seed_articles.py)
  (NLP Processing - Entities / Summaries)
}
package "Enrichment Pipeline" {
  (Bloom Taxonomy - Classification)
  (Signal Quality Index - 0.0 - 1.0)
  (Source Diversity - Score)
  (Domain Breakdown)
}
package "Data Catalog" {
  (registry.json)
}
HN - -> SEED
ARXIV - -> SEED
PUBMED - -> SEED
SEED - -> REG
MANUAL - -> REG
REG - -> NLP
NLP - -> BLOOM
NLP - -> SQI
NLP - -> DIV
REG - -> DOMAIN

@enduml

