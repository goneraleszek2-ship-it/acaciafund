@startuml
title Build Process - Sequence Diagram

actor Developer
participant GitHub
participant Cloudflare_Pages
participant Build
participant Registry
participant Visuals
participant Templates
participant Dist

Developer -> GitHub : git push main
GitHub -> Cloudflare_Pages : Webhook trigger
Cloudflare_Pages -> Build : python3 generator.py
Build -> Registry : Read 60 content entries
Registry - -> Build : Return catalog data
Build -> Build : Validate with schemas.py
Build -> Visuals : Generate SVGs
Visuals - -> Build : 60 thumbnails + OG images
Build -> Templates : Render with Jinja2
Templates - -> Build : 236 HTML pages
Build -> Dist : Write output
Build -> Build : Smoke tests (12/12)
Dist - -> Cloudflare_Pages : Deployment artifact
Cloudflare_Pages -> Cloudflare_Pages : CDN cache warm
Cloudflare_Pages - -> Developer : Site live
@enduml

