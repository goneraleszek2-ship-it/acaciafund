flowchart LR
    subgraph Sources["📡 RSS Feeds"]
        TC[TechCrunch
          news.tech]
        WIRED[Wired
          news.tech]
        ARS[ArsTechnica
          news.tech]
        GH[GitHub Blog
          engineering.blog]
        CF[Cloudflare Blog
          engineering.blog]
        KB[Krebs on Security
          news.security]
        BL[Blloomberg Markets
          news.finance]
        AI[Import AI
          news.ai]
    end

    subgraph Fetch["⚙️ RSSFetcher"]
        HTTP[_cached_request
          User-Agent + retry 3x]
        PARSE[_parse_feed
          xml.etree]
        DETECT[Auto-detect
          RSS vs Atom]
        FILTER[_is_recent
          since_hours filter]
    end

    subgraph Quality["🔬 Quality Layer"]
        HEALTH[HealthRecord
          latency / item_count / error]
        DLQ[Dead Letter Queue
          write_dlq on failure]
        CACHE[cache_ttl_hours
          avoid re-fetch]
    end

    subgraph Pipeline["🏗️ ingest.py"]
        REGISTRY[registry.enabled
          fetch all]
        CLASSIFY[classify_story
          pillar assignment]
        DIST[distribute to
          pillar_stories dict]
        MERGE[merge with HN / arXiv / PubMed]
    end

    subgraph Output["📄 Generated Pages"]
        BUILD[build.py
          Jinja2 render]
        PAGES[236 static pages]
    end

    TC --> HTTP
    WIRED --> HTTP
    ARS --> HTTP
    GH --> HTTP
    CF --> HTTP
    KB --> HTTP
    BL --> HTTP
    AI --> HTTP
    HTTP --> PARSE
    PARSE --> DETECT
    DETECT --> FILTER
    FILTER --> HEALTH
    FILTER --> DLQ
    FILTER --> CACHE
    HEALTH --> REGISTRY
    CACHE --> REGISTRY
    REGISTRY --> CLASSIFY
    CLASSIFY --> DIST
    DIST --> MERGE
    MERGE --> BUILD
    BUILD --> PAGES

