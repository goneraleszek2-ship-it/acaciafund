<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="400" height="225">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glow" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="225" fill="url(#bg)"/>
  <rect width="400" height="225" fill="url(#glow)"/>

  <!-- Grid -->
  <g stroke="#2d5a8e" stroke-width="0.5" opacity="0.2">
    <line x1="0" y1="50" x2="400" y2="50"/><line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/><line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="225"/><line x1="200" y1="0" x2="200" y2="225"/>
    <line x1="300" y1="0" x2="300" y2="225"/>
  </g>

  <!-- Shield icon -->
  <g transform="translate(160, 35) scale(1.3)">
    <path d="M20 2 L3 10 L3 18 Q3 30 20 36 Q37 30 37 18 L37 10 Z" fill="none" stroke="#d97706" stroke-width="2" opacity="0.8"/>
    <path d="M13 18 L18 23 L27 14" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Data lines -->
  <line x1="50" y1="170" x2="350" y2="170" stroke="#2d5a8e" stroke-width="1" opacity="0.4"/>
  <polyline points="50,170 100,155 150,160 200,140 250,145 300,130 350,135"
    fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  <polygon points="50,170 100,155 150,160 200,140 250,145 300,130 350,135 350,170"
    fill="#d97706" opacity="0.06"/>

  <!-- Dots on line -->
  <circle cx="100" cy="155" r="2.5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="200" cy="140" r="2.5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="300" cy="130" r="2.5" fill="#f59e0b" opacity="0.8"/>

  <text x="200" y="210" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#e2e8f0" letter-spacing="4">AML</text>
</svg>