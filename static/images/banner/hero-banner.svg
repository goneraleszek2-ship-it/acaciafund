<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" width="1400" height="600">
  <!-- Data visualization chart lines — transparent bg, visible on any background -->
  <g opacity="0.6">
    <!-- Grid lines -->
    <line x1="100" y1="200" x2="1300" y2="200" stroke="currentColor" stroke-width="0.5" opacity="0.15"/>
    <line x1="100" y1="300" x2="1300" y2="300" stroke="currentColor" stroke-width="0.5" opacity="0.15"/>
    <line x1="100" y1="400" x2="1300" y2="400" stroke="currentColor" stroke-width="0.5" opacity="0.15"/>
    <line x1="100" y1="500" x2="1300" y2="500" stroke="currentColor" stroke-width="0.5" opacity="0.15"/>
  </g>

  <!-- Line chart — 3 pillars -->
  <polyline points="100,480 200,420 300,440 400,360 500,380 600,320 700,340 800,280 900,300 1000,240 1100,260 1200,200 1300,220"
    fill="none" stroke="#d97706" stroke-width="3" opacity="0.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="100,490 200,440 300,460 400,390 500,410 600,350 700,370 800,310 900,330 1000,270 1100,290 1200,230 1300,250"
    fill="none" stroke="#22c55e" stroke-width="2" opacity="0.4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="100,500 200,460 300,470 400,420 500,440 600,390 700,400 800,350 900,360 1000,310 1100,320 1200,270 1300,290"
    fill="none" stroke="#a855f7" stroke-width="2" opacity="0.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Filled area under first line -->
  <polygon points="100,480 200,420 300,440 400,360 500,380 600,320 700,340 800,280 900,300 1000,240 1100,260 1200,200 1300,220 1300,600 100,600"
    fill="#d97706" opacity="0.04"/>

  <!-- Data dots -->
  <circle cx="800" cy="280" r="5" fill="#d97706" opacity="0.7"/>
  <circle cx="1000" cy="240" r="4" fill="#d97706" opacity="0.5"/>
  <circle cx="600" cy="320" r="4" fill="#22c55e" opacity="0.5"/>
  <circle cx="1200" cy="200" r="5" fill="#d97706" opacity="0.8"/>

  <!-- Decorative dots -->
  <g opacity="0.08">
    <circle cx="200" cy="150" r="2" fill="currentColor"/>
    <circle cx="400" cy="100" r="2" fill="currentColor"/>
    <circle cx="600" cy="180" r="2" fill="currentColor"/>
    <circle cx="800" cy="120" r="2" fill="currentColor"/>
    <circle cx="1000" cy="160" r="2" fill="currentColor"/>
    <circle cx="1200" cy="100" r="2" fill="currentColor"/>
  </g>

  <!-- Subtle accent line at bottom -->
  <line x1="0" y1="575" x2="1400" y2="575" stroke="url(#accent)" stroke-width="1" opacity="0.2"/>

  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
</svg>