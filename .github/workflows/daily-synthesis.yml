name: Daily Synthesis

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Ingest & generate
        run: python ingest.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Astro app
        working-directory: web
        run: npm ci

      - name: Install Python test deps
        run: python -m pip install --upgrade pip pytest

      - name: Build Astro app
        working-directory: web
        run: npm run build

      - name: Run integration tests
        run: |
          python tests/astro_smoke.py
          python -m pytest tests/test_metadata.py tests/test_core.py -q
          hugo --cleanDestinationDir

      - name: Commit & push new content
        run: |
          git config user.name "AcaciaFund Bot"
          git config user.email "bot@acaciafund.org"
          git add content/**/blog/ registry/
          if git diff --cached --quiet; then
            echo "No new content — exiting"
            exit 0
          fi
          git commit -m "daily: automated synthesis $(date +%Y-%m-%d)"
          git push

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
