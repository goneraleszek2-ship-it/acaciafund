name: Daily Synthesis

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Ingest & generate
        run: python ingest.py

      - name: Generate Diagrams
        run: python generate_diagrams.py

      - name: Generate Notebook
        run: python generate_notebook.py

      - name: Generate Metadata API
        run: python generate_metadata.py

      - name: LLM Enhancement (optional)
        run: python generate_llm.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
          LLM_MAX_POSTS: ${{ vars.LLM_MAX_POSTS || '50' }}

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.161.1"

      - name: Build site
        run: hugo --cleanDestinationDir

      - name: Commit & push new content
        run: |
          git config user.name "AcaciaFund Bot"
          git config user.email "bot@acaciafund.org"
          git add content/daily/
          if git diff --cached --quiet; then
            echo "No new content — exiting"
            exit 0
          fi
          git commit -m "daily: automatyczna synteza $(date +%Y-%m-%d)"
          git push

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=acaciafund
          workingDirectory: .
