name: "Weekly Source Refresh"
on:
  schedule:
    - cron: "0 4 * * 1"  # Weekly on Monday at 04:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Force full refresh"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements-build.txt

      - name: Regenerate ontology
        run: |
          python3 -c "
          import sys; sys.path.insert(0, '.')
          from core.ontology import OntologyManager
          mgr = OntologyManager()
          mgr.seed_all_pillars()
          mgr.seed_relations()
          print(f'Seeded {mgr.concept_count()} concepts, {mgr.relation_count()} relations')
          mgr.save('data/ontology.json')
          "

      - name: Generate glossary pages
        run: python3 scripts/generate_glossaries.py

      - name: Run source synthesis
        run: python3 scripts/source_synthesis.py || echo "Synthesis skipped (missing parquet)"

      - name: Run source verification
        run: python3 scripts/source_verification.py || echo "Verification skipped"

      - name: Check source freshness
        run: python3 scripts/check_source_freshness.py --update-ontology || echo "Freshness check skipped"

      - name: Generate weekly notes
        run: python3 scripts/generate_weekly_notes.py --force || echo "Weekly notes generation skipped"

      - name: Rebuild site
        run: |
          rm -rf dist .build_cache.json
          python3 build.py

      - name: Check links and SQI
        run: python3 scripts/check_links_and_sqi.py --dist-dir dist || true

      - name: Upload link-check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: link-check-report
          path: dist/link-check-report.json
          retention-days: 30

      - name: Upload source-health report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-health-report
          path: data/source_health.json
          retention-days: 30

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ontology.json registry.json data/source_health.json data/weekly_notes.json data/news.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: weekly source refresh — ontology + glossary + freshness check"
            git push
          fi
          
