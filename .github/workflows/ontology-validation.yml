name: "Ontology Validation & CI/CD Gates"

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ontology-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir networkx pyarrow

      - name: Delta Check (git diff)
        id: diff-check
        run: |
          # Check if ontology or related files changed
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E "ontology\\.json|deontic|bitmask|shacl|turtle|yaml$" || true)
          echo "changed_files=$CHANGED" >> $GITHUB_OUTPUT
          if [ -z "$CHANGED" ]; then
            echo "::notice::No ontology-related files changed, skipping formal reasoning"
          fi

      - name: Generate deontic bitmasks
        if: steps.diff-check.changed_files != ''
        run: python3 deontic_build.py

      - name: Ontology DAG Validation
        if: steps.diff-check.changed_files != ''
        run: |
          python3 - <<'PYEOF'
          import json
          import networkx as nx

          with open('data/ontology.json') as f:
              data = json.load(f)

          G = nx.DiGraph()
          for concept in data['concepts']:
              G.add_node(concept['id'], epistemic_status=concept.get('epistemic_status'))
          for rel in data['relations']:
              G.add_edge(rel['source_id'], rel['target_id'], type=rel['relation_type'])

          req_graph = nx.subgraph_view(G, filter_edge=lambda u, v: G[u][v]['type'] == 'requires')
          is_acyclic = nx.is_directed_acyclic_graph(req_graph)
          cycles = list(nx.simple_cycles(req_graph))

          print('DAG acyclicity: {} (cycles: {})'.format('PASS' if is_acyclic else 'FAIL', len(cycles)))
          if cycles:
              print('  Cycles: {}'.format(' -> '.join(cycles[:3])))
          else:
              print('  No cycles - DAG is valid')

          if not is_acyclic:
              print('::error::Ontology requires-relation DAG contains cycles')
              raise SystemExit(1)
          PYEOF

      - name: Deontic Bitmask Verification
        if: steps.diff-check.changed_files != ''
        run: |
          python3 - <<'PYEOF'
          import json

          with open('dist/deontic_bitmasks.json') as f:
              data = json.load(f)

          print('Deontic bitmasks verified:')
          print('  Obligation bits: {}'.format(data['obligation_count']))
          print('  Permission bits: {}'.format(data['permission_count']))
          print('  Prohibition bits: {}'.format(data['prohibition_count']))
          valid = (
              data['obligation_mask'] > 0
              and data['permission_mask'] > 0
              and data['prohibition_mask'] > 0
          )
          print('  Masks valid: {}'.format(valid))
          if not valid:
              print('::error::Deontic bitmask masks invalid (zero-valued masked set)')
              raise SystemExit(1)
          PYEOF

      - name: Bitmask & Schema Export
        if: steps.diff-check.changed_files != ''
        run: |
          python3 scripts/bitmask_exporter.py
          python3 - <<'PYEOF'
          import json

          with open('dist/deontic_bitmasks.json') as f:
              data = json.load(f)

          print('Bitmask data verified: {} obligation bits, {} permission bits, {} prohibition bits'.format(
              data['obligation_count'],
              data['permission_count'],
              data['prohibition_count'],
          ))
          PYEOF