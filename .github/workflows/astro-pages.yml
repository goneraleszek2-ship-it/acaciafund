name: Astro Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'content/**'
      - 'core/**'
      - 'registry/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'static/**'
      - 'ingest.py'
      - '.github/workflows/astro-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Astro app
        working-directory: web
        run: npm ci

      - name: Build Astro app
        working-directory: web
        run: npm run build

      - name: Deploy preview site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=acaciafund-next
          workingDirectory: web
