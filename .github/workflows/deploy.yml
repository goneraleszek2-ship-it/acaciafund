name: "Deploy to Cloudflare Pages"
on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"  # Daily at 06:00 UTC – AML content ingestion + deploy

permissions:
  contents: read
  deployments: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements-build.txt
          pip install --no-cache-dir ruff pyright

      - name: Lint
        run: ruff check .

      - name: Type check
        run: pyright

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install full dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            .build_cache.json
            dist/
          key: build-${{ hashFiles('templates/**/*', 'core/**/*.py', 'config.py') }}
          restore-keys: |
            build-

      - name: Multi-pillar knowledge ingestion
        env:
          HF_HUB_OFFLINE: "1"
        run: python scripts/knowledge_ingester.py --pillar all --source all --days 3

      - name: Enrich registry
        run: python scripts/enrich.py

      - name: Pre-build smoke tests
        run: python -m pytest tests/test_smoke.py -v

      - name: Build
        timeout-minutes: 20
        run: python3 build.py
        env:
          PYTHONUNBUFFERED: "1"
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Post-build smoke tests
        run: |
          python3 -c "
import json, sys
from pathlib import Path

errors = []
dist = Path('dist')

# Check essential output files exist
for f in ['index.html', 'build-meta.json', 'sitemap.xml']:
    if not (dist / f).exists():
        errors.append(f'Missing dist/{f}')

# Check build errors log is empty
log = dist / 'build_errors.log'
if log.exists() and log.read_text().strip():
    errors.append(f'build_errors.log is not empty:\n{log.read_text()[:500]}')

# Validate build-meta.json
meta = dist / 'build-meta.json'
if meta.exists():
    data = json.loads(meta.read_text())
    for key in ['page_count', 'duration_seconds', 'timestamp']:
        if key not in data:
            errors.append(f'build-meta.json missing key: {key}')

if errors:
    print('Post-build smoke tests FAILED:', file=sys.stderr)
    for e in errors:
        print(f'  - {e}', file=sys.stderr)
    sys.exit(1)
else:
    print('Post-build smoke tests passed.')
"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=acaciafund
