name: "Deploy to Cloudflare Pages"
on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"  # Daily at 06:00 UTC – AML content ingestion + deploy

permissions:
  contents: read
  deployments: write

jobs:
  quality:
    runs-on: ubuntu-26.04  # Pin to the GA image instead of the migrating ubuntu-latest label
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements-build.txt
          pip install --no-cache-dir ruff pyright

      - name: Lint
        run: ruff check .

      - name: Type check (baseline-gated)
        run: |
          set +e
          pyright > /tmp/pyright.log 2>&1
          STATUS=$?
          ERRORS=$(grep -c "error:" /tmp/pyright.log || true)
          BASELINE=0
          echo "pyright errors: ${ERRORS} (baseline ${BASELINE})"
          if [ "${ERRORS}" -gt "${BASELINE}" ]; then
            echo "::error::pyright errors increased (${ERRORS} > baseline ${BASELINE}). Fix regressions before merging."
            grep "error:" /tmp/pyright.log
            exit 1
          fi
          # Exit non-zero when pyright exits with an unexpected fatal error.
          if [ "${STATUS}" -ne 0 ] && [ "${ERRORS}" -eq 0 ]; then
            echo "::error::pyright failed without reporting errors."
            tail -50 /tmp/pyright.log
            exit 1
          fi
          exit 0

  deploy:
    needs: quality
    runs-on: ubuntu-26.04  # Pin to the GA image instead of the migrating ubuntu-latest label
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install full dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir pytest

      - name: Multi-pillar knowledge ingestion
        env:
          HF_HUB_OFFLINE: "1"
        run: python scripts/knowledge_ingester.py --pillar all --source all --days 7

      - name: Enrich registry
        run: python scripts/enrich.py

      - name: Fetch field news (RSS feeds + Hacker News + GDELT)
        run: python scripts/fetch_news.py

      - name: Pre-build smoke tests
        run: python -m pytest tests/test_smoke.py -v

      - name: Clean build output
        run: rm -rf dist .build_cache.json

      - name: Build
        timeout-minutes: 20
        run: python3 build.py
        env:
          PYTHONUNBUFFERED: "1"
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Post-build smoke tests
        run: python3 scripts/deploy_checks.py

      - name: Frontend smoke (blocking P0 gate)
        timeout-minutes: 15
        run: |
          python -m pip install --no-cache-dir -r requirements-e2e.txt
          python -m playwright install --with-deps chromium
          python -m pytest tests/e2e -o addopts="" -m "e2e and not slow" -q

      - name: Full test suite
        timeout-minutes: 15
        run: python -m pytest tests/ -q

      - name: Content structure audit
        run: python3 scripts/audit_content_structure.py --report dist/content-structure-report.json

      - name: Enforce quality gate
        run: python3 scripts/enforce_quality_gate.py --build-meta dist/build-meta.json

      - name: Check internal links and SQI
        run: python3 scripts/check_links_and_sqi.py --dist-dir dist

      - name: Check external references
        timeout-minutes: 10
        run: python3 scripts/check_external_links.py --dist-dir dist

      - name: Topic currency triage
        run: python3 scripts/check_entry_freshness.py topics --fail-on-cold 0

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=acaciafund

      - name: Verify admin access gate
        timeout-minutes: 5
        run: python3 scripts/verify_admin_access.py --base-url https://www.acaciafund.org
