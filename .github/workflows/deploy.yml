name: "Deploy to Cloudflare Pages"
on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"  # Daily at 06:00 UTC – AML content ingestion + deploy

permissions:
  contents: read
  deployments: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements-build.txt
          pip install --no-cache-dir ruff pyright

      - name: Lint
        run: ruff check .

      - name: Type check
        run: pyright || true

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install full dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir pytest

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            .build_cache.json
            dist/
          key: build-${{ hashFiles('templates/**/*', 'core/**/*.py', 'config.py') }}
          restore-keys: |
            build-

      - name: Multi-pillar knowledge ingestion
        env:
          HF_HUB_OFFLINE: "1"
        run: python scripts/knowledge_ingester.py --pillar all --source all --days 7

      - name: Enrich registry
        run: python scripts/enrich.py

      - name: Fetch field news (RSS feeds + Hacker News + GDELT)
        run: python scripts/fetch_news.py

      - name: Pre-build smoke tests
        run: python -m pytest tests/test_smoke.py -v

      - name: Build
        timeout-minutes: 20
        run: python3 build.py
        env:
          PYTHONUNBUFFERED: "1"
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Post-build smoke tests
        run: python3 scripts/deploy_checks.py

      - name: Content structure audit
        run: python3 scripts/audit_content_structure.py --report dist/content-structure-report.json

      - name: Enforce quality gate
        run: python3 scripts/enforce_quality_gate.py --build-meta dist/build-meta.json

      - name: Check external references
        timeout-minutes: 10
        run: python3 scripts/check_external_links.py --dist-dir dist

      - name: Topic currency triage
        run: python3 scripts/check_entry_freshness.py topics --fail-on-cold 0

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=acaciafund
