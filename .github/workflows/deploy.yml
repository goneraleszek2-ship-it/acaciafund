name: "Deploy to Cloudflare Pages"
on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"  # Daily at 06:00 UTC – AML content ingestion + deploy

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Multi-pillar knowledge ingestion
        env:
          HF_HUB_OFFLINE: "1"
        run: python scripts/knowledge_ingester.py --pillar all --source all --days 3

      - name: Enrich registry
        run: python scripts/enrich.py

      - name: Smoke tests
        run: python -m pytest tests/test_smoke.py -v

      - name: Build
        run: python build.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=acaciafund
