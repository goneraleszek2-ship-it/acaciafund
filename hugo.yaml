baseURL: "https://acaciafund.org/"
locale: "pl-pl"
title: "AcaciaFund | Daily Research Portfolio"
publishDir: "public"
relativeURLs: true


permalinks:
  daily: /:sections/:contentbasename/

outputs:
  home: [html]
  page: [html, json]
  section: [html, rss]

markup:
  goldmark:
    renderer:
      unsafe: true

menus:
  main:
    - name: "Home"
      url: "/"
      weight: 1
    - name: "AML"
      url: "/daily/aml/"
      weight: 2
    - name: "Markets"
      url: "/daily/stock/"
      weight: 3
    - name: "Science"
      url: "/daily/science/"
      weight: 4
    - name: "Radar"
      url: "/radar/"
      weight: 5
    - name: "Diagramy"
      url: "/diagrams/"
      weight: 6
    - name: "Notebook"
      url: "/notebook/"
      weight: 7
