
<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
    <div id="status-text" style="color: #666; margin-bottom: 10px;">Loading data...</div>
    <canvas id="metricsChart" style="max-height: 400px;"></canvas>

    <script>
    const embeddedData = {
        "generated_at": "2026-06-20T06:16:36.499315+00:00",
        "data": [
            { "article_slug": "learn/sector-competitive-analysis", "quality_score": 0.715 },
            { "article_slug": "learn/applying-market-analysis", "quality_score": 0.69 },
            { "article_slug": "learn/market-analysis-methods", "quality_score": 0.76 },
            { "article_slug": "learn/market-fundamentals", "quality_score": 0.708 },
            { "article_slug": "learn/designing-aml-program", "quality_score": 0.765 }
        ]
    };

    function initDashboard() {
        const ctx = document.getElementById('metricsChart').getContext('2d');
        const labels = embeddedData.data.map(item => item.article_slug.split('/')[1]);
        const values = embeddedData.data.map(item => item.quality_score);

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{ label: 'Quality Score', data: values, backgroundColor: 'red' }]
            },
            options: { scales: { y: { beginAtZero: true, max: 1 } } }
        });
        document.getElementById('status-text').innerText = "Data Updated: Success";
        document.getElementById('status-text').style.color = "green";
    }

    function waitForLibrary() {
        if (typeof Chart !== 'undefined') {
            initDashboard();
        } else {
            setTimeout(waitForLibrary, 500);
        }
    }
    waitForLibrary();
    </script>
</body>
</html>
