<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420">
  <defs>
    <style>
      .ring { fill:none; stroke-width:34; stroke-linecap:round; }
      .label { font-family: Inter, Arial; font-size:14px; fill:#111827; }
      .tool { font-size:12px; fill:#ffffff; font-weight:600; }
    </style>
  </defs>

  <!-- outer UI ring -->
  <circle cx="210" cy="210" r="180" class="ring" stroke="#0f172a" />
  <text x="210" y="36" text-anchor="middle" class="label">UI / Frontend</text>
  <g transform="translate(210,60)">
    <text text-anchor="middle" class="tool">Hugo • Bootstrap • GLightbox</text>
  </g>

  <!-- Learning ring -->
  <circle cx="210" cy="210" r="130" class="ring" stroke="#047857" />
  <text x="210" y="106" text-anchor="middle" class="label">Adaptive Learning</text>
  <g transform="translate(210,130)">
    <text text-anchor="middle" class="tool">Python • Jupyter • Scikit</text>
  </g>

  <!-- Simulation ring -->
  <circle cx="210" cy="210" r="80" class="ring" stroke="#2563eb" />
  <text x="210" y="170" text-anchor="middle" class="label">Personal Simulation</text>
  <g transform="translate(210,190)">
    <text text-anchor="middle" class="tool">NumPy • SimPy • Pandas</text>
  </g>

  <!-- Core / Identity -->
  <circle cx="210" cy="210" r="36" class="ring" stroke="#c026d3" />
  <text x="210" y="210" text-anchor="middle" class="label" dy="-6">Identity</text>
  <g transform="translate(210,230)">
    <text text-anchor="middle" class="tool">DIDs • ed25519 • ZK</text>
  </g>
</svg>
