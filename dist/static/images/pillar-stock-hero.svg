<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="stock-hero-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#052e16"/>
      <stop offset="1" stop-color="#0f0f23"/>
    </linearGradient>
    <radialGradient id="stock-hero-glow" cx="50%" cy="50%">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stock-hero-line" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#22c55e" stop-opacity="0.3"/>
      <stop offset="0.7" stop-color="#22c55e" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#stock-hero-bg)" rx="8"/>
  <rect width="600" height="300" fill="url(#stock-hero-glow)"/>

  <!-- Sine wave pattern -->
  <g opacity="0.2">
    <path d="M0 160 Q50 100 100 160 T200 160 T300 160 T400 160 T500 160 T600 160" fill="none" stroke="#22c55e" stroke-width="1"/>
    <path d="M0 180 Q50 140 100 180 T200 180 T300 180 T400 180 T500 180 T600 180" fill="none" stroke="#22c55e" stroke-width="0.8"/>
    <path d="M0 200 Q50 170 100 200 T200 200 T300 200 T400 200 T500 200 T600 200" fill="none" stroke="#22c55e" stroke-width="0.5"/>
  </g>

  <!-- Candlestick bars -->
  <g opacity="0.35">
    <line x1="80" y1="50" x2="80" y2="150" stroke="#4ade80" stroke-width="3"/>
    <rect x="73" y="70" width="14" height="40" rx="2" fill="#4ade80" opacity="0.6"/>
    <line x1="168" y1="80" x2="168" y2="160" stroke="#22c55e" stroke-width="3"/>
    <rect x="161" y="100" width="14" height="30" rx="2" fill="#22c55e" opacity="0.5"/>
    <line x1="256" y1="100" x2="256" y2="180" stroke="#4ade80" stroke-width="3"/>
    <rect x="249" y="120" width="14" height="25" rx="2" fill="#4ade80" opacity="0.4"/>
    <line x1="344" y1="60" x2="344" y2="140" stroke="#22c55e" stroke-width="3"/>
    <rect x="337" y="80" width="14" height="35" rx="2" fill="#22c55e" opacity="0.5"/>
    <line x1="432" y1="90" x2="432" y2="170" stroke="#4ade80" stroke-width="3"/>
    <rect x="425" y="110" width="14" height="30" rx="2" fill="#4ade80" opacity="0.4"/>
    <line x1="520" y1="70" x2="520" y2="150" stroke="#22c55e" stroke-width="3"/>
    <rect x="513" y="90" width="14" height="35" rx="2" fill="#22c55e" opacity="0.5"/>
  </g>

  <!-- Trend line overlay -->
  <polyline points="80,120 168,140 256,130 344,110 432,120 520,100" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.5" stroke-dasharray="4,3"/>

  <!-- Vertical accent lines -->
  <line x1="100" y1="230" x2="100" y2="280" stroke="url(#stock-hero-line)" stroke-width="0.5"/>
  <line x1="500" y1="230" x2="500" y2="280" stroke="url(#stock-hero-line)" stroke-width="0.5"/>

  <!-- Bottom accent bar -->
  <rect x="200" y="280" width="200" height="3" rx="1.5" fill="#22c55e" opacity="0.4"/>
  <circle cx="300" cy="281.5" r="3" fill="#22c55e" opacity="0.6"/>
</svg>
