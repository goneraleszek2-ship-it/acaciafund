<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <defs>
    <linearGradient id="pd-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#0f0f23"/>
    </linearGradient>
    <linearGradient id="pd-aml" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="pd-markets" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="pd-science" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="pd-arrow-aml" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="pd-arrow-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="pd-arrow-purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="pd-arrow-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="pd-arrow-teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <filter id="pd-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="420" fill="url(#pd-bg)" rx="12"/>
  <text x="450" y="32" text-anchor="middle" fill="#e8e6e3" font-family="system-ui,sans-serif" font-size="15" font-weight="700" letter-spacing="1">DATAOPS CONTENT PIPELINE</text>

  <!-- Node 1: INGEST -->
  <rect x="20" y="55" width="120" height="100" rx="8" fill="#1f1f36" stroke="#d97706" stroke-width="1.5" filter="url(#pd-glow)"/>
  <text x="80" y="82" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="12" font-weight="700">INGEST</text>
  <text x="80" y="100" text-anchor="middle" fill="#9d9bb0" font-family="system-ui,sans-serif" font-size="9">HN API</text>
  <text x="80" y="114" text-anchor="middle" fill="#9d9bb0" font-family="system-ui,sans-serif" font-size="9">arXiv OAI</text>
  <text x="80" y="128" text-anchor="middle" fill="#9d9bb0" font-family="system-ui,sans-serif" font-size="9">PubMed E-utilities</text>
  <rect x="25" y="140" width="110" height="14" rx="3" fill="#d97706" opacity="0.15"/>
  <text x="80" y="150" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="8" opacity="0.7">~30 stories/day</text>

  <!-- Arrow 1→2 -->
  <line x1="140" y1="105" x2="180" y2="105" stroke="url(#pd-arrow-aml)" stroke-width="2" marker-end="none"/>
  <polygon points="178,99 188,105 178,111" fill="#d97706"/>
  <text x="160" y="98" text-anchor="middle" fill="#6b6a80" font-family="system-ui,sans-serif" font-size="7">1. fetch</text>

  <!-- Node 2: CLASSIFY -->
  <rect x="190" y="55" width="120" height="100" rx="8" fill="#1f1f36" stroke="#22c55e" stroke-width="1.5" filter="url(#pd-glow)"/>
  <text x="250" y="82" text-anchor="middle" fill="#4ade80" font-family="system-ui,sans-serif" font-size="12" font-weight="700">CLASSIFY</text>
  <text x="250" y="100" text-anchor="middle" fill="#9d9bb0" font-family="system-ui,sans-serif" font-size="9">Bloom taxonomy</text>
  <text x="250" y="114" text-anchor="middle" fill="#9d9bb0" font-family="system-ui,sans-serif" font-size="9">NER extraction</text>
  <text x="250" y="128" text-anchor="middle" fill="#9d9bb0" font-family="system-ui,sans-serif" font-size="9">Topic modeling</text>
  <rect x="195" y="140" width="110" height="14" rx="3" fill="#22c55e" opacity="0.15"/>
  <text x="250" y="150" text-anchor="middle" fill="#4ade80" font-family="system-ui,sans-serif" font-size="8" opacity="0.7">6 cognitive levels</text>

  <!-- Arrow 2→3 -->
  <line x1="310" y1="105" x2="350" y2="105" stroke="url(#pd-arrow-green)" stroke-width="2"/>
  <polygon points="348,99 358,105 348,111" fill="#22c55e"/>
  <text x="330" y="98" text-anchor="middle" fill="#6b6a80" font-family="system-ui,sans-serif" font-size="7">2. enrich</text>

  <!-- Node 3: SCORE -->
  <rect x="360" y="55" width="120" height="100" rx="8" fill="#1f1f36" stroke="#a855f7" stroke-width="1.5" filter="url(#pd-glow)"/>
  <text x="420" y="82" text-anchor="middle" fill="#c084fc" font-family="system-ui,sans-serif" font-size="12" font-weight="700">SCORE</text>
  <text x="420" y="100" text-anchor="middle" fill="#9d9bb0" font-family="system-ui,sans-serif" font-size="9">SQI computation</text>
  <text x="420" y="114" text-anchor="middle" fill="#9d9bb0" font-family="system-ui,sans-serif" font-size="9">Authority 0.35</text>
  <text x="420" y="128" text-anchor="middle" fill="#9d9bb0" font-family="system-ui,sans-serif" font-size="9">Freshness 0.25</text>
  <rect x="365" y="140" width="110" height="14" rx="3" fill="#a855f7" opacity="0.15"/>
  <text x="420" y="150" text-anchor="middle" fill="#c084fc" font-family="system-ui,sans-serif" font-size="8" opacity="0.7">composite [0,1]</text>

  <!-- Arrow 3→4 -->
  <line x1="480" y1="105" x2="520" y2="105" stroke="url(#pd-arrow-purple)" stroke-width="2"/>
  <polygon points="518,99 528,105 518,111" fill="#a855f7"/>
  <text x="500" y="98" text-anchor="middle" fill="#6b6a80" font-family="system-ui,sans-serif" font-size="7">3. weigh</text>

