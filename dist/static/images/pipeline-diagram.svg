  <rect x="530" y="55" width="120" height="100" rx="8" fill="#1f1f36" stroke="#60a5fa" stroke-width="1.5" filter="url(#pd-glow)"/>
  <text x="590" y="82" text-anchor="middle" fill="#93bbfd" font-family="system-ui,sans-serif" font-size="12" font-weight="700">QUALITY GATE</text>
  <text x="590" y="100" text-anchor="middle" fill="#9d9bb0" font-family="system-ui,sans-serif" font-size="9">SQI ≥ 0.35</text>
  <text x="590" y="114" text-anchor="middle" fill="#9d9bb0" font-family="system-ui,sans-serif" font-size="9">Schema validate</text>
  <text x="590" y="128" text-anchor="middle" fill="#9d9bb0" font-family="system-ui,sans-serif" font-size="9">Source diversity</text>
  <rect x="535" y="140" width="110" height="14" rx="3" fill="#60a5fa" opacity="0.15"/>
  <text x="590" y="150" text-anchor="middle" fill="#93bbfd" font-family="system-ui,sans-serif" font-size="8" opacity="0.7">3 validation checks</text>

  <!-- Arrow 4→5 -->
  <line x1="650" y1="105" x2="690" y2="105" stroke="url(#pd-arrow-blue)" stroke-width="2"/>
  <polygon points="688,99 698,105 688,111" fill="#60a5fa"/>
  <text x="670" y="98" text-anchor="middle" fill="#6b6a80" font-family="system-ui,sans-serif" font-size="7">4. pass</text>

