  <rect x="700" y="55" width="120" height="100" rx="8" fill="#1f1f36" stroke="#22c55e" stroke-width="1.5" filter="url(#pd-glow)"/>
  <text x="760" y="82" text-anchor="middle" fill="#4ade80" font-family="system-ui,sans-serif" font-size="12" font-weight="700">GENERATE</text>
  <text x="760" y="100" text-anchor="middle" fill="#9d9bb0" font-family="system-ui,sans-serif" font-size="9">Jinja2 render</text>
  <text x="760" y="114" text-anchor="middle" fill="#9d9bb0" font-family="system-ui,sans-serif" font-size="9">Pydantic model</text>
  <text x="760" y="128" text-anchor="middle" fill="#9d9bb0" font-family="system-ui,sans-serif" font-size="9">Static HTML out</text>
  <rect x="705" y="140" width="110" height="14" rx="3" fill="#22c55e" opacity="0.15"/>
  <text x="760" y="150" text-anchor="middle" fill="#4ade80" font-family="system-ui,sans-serif" font-size="8" opacity="0.7">python3.13 gen</text>

  <!-- Arrow 5→DEPLOY -->
  <line x1="820" y1="105" x2="860" y2="105" stroke="url(#pd-arrow-teal)" stroke-width="2"/>
  <polygon points="858,99 868,105 858,111" fill="#22c55e"/>
  <text x="840" y="98" text-anchor="middle" fill="#6b6a80" font-family="system-ui,sans-serif" font-size="7">5. build</text>

