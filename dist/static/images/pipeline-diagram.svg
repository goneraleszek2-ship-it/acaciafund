  <rect x="700" y="195" width="120" height="100" rx="8" fill="#1f1f36" stroke="#d97706" stroke-width="1.5" filter="url(#pd-glow)"/>
  <text x="760" y="222" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="12" font-weight="700">DEPLOY</text>
  <text x="760" y="240" text-anchor="middle" fill="#9d9bb0" font-family="system-ui,sans-serif" font-size="9">Cloudflare Pages</text>
  <text x="760" y="254" text-anchor="middle" fill="#9d9bb0" font-family="system-ui,sans-serif" font-size="9">Railway API</text>
  <text x="760" y="268" text-anchor="middle" fill="#9d9bb0" font-family="system-ui,sans-serif" font-size="9">CDN cache</text>
  <rect x="705" y="280" width="110" height="14" rx="3" fill="#d97706" opacity="0.15"/>
  <text x="760" y="290" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="8" opacity="0.7">auto-deploy main</text>

  <!-- Down arrow from Generate to Deploy -->
  <line x1="760" y1="155" x2="760" y2="193" stroke="#6b6a80" stroke-width="1.5" stroke-dasharray="3,3"/>
  <polygon points="754,190 760,198 766,190" fill="#6b6a80"/>

  <!-- Metrics bar at bottom -->
  <rect x="20" y="330" width="860" height="70" rx="8" fill="#1f1f36" stroke="#2d2d4a" stroke-width="1"/>
  <text x="450" y="350" text-anchor="middle" fill="#6b6a80" font-family="system-ui,sans-serif" font-size="9" letter-spacing="2">PIPELINE METRICS</text>

  <circle cx="70" cy="372" r="4" fill="#d97706"/>
  <text x="82" y="376" fill="#9d9bb0" font-family="system-ui,sans-serif" font-size="11">51 entries</text>

  <circle cx="220" cy="372" r="4" fill="#22c55e"/>
  <text x="232" y="376" fill="#9d9bb0" font-family="system-ui,sans-serif" font-size="11">33 research · 8 learn · 10 knowledge</text>

  <circle cx="480" cy="372" r="4" fill="#a855f7"/>
  <text x="492" y="376" fill="#9d9bb0" font-family="system-ui,sans-serif" font-size="11">3 pillars · 6 Bloom levels</text>

  <circle cx="700" cy="372" r="4" fill="#60a5fa"/>
  <text x="712" y="376" fill="#9d9bb0" font-family="system-ui,sans-serif" font-size="11">59 HTML pages · 50 thumbnails</text>

  <text x="450" y="392" text-anchor="middle" fill="#6b6a80" font-family="system-ui,sans-serif" font-size="8">www.acaciafund.org · python3.13 generator.py · Cloudflare Pages</text>
</svg>
