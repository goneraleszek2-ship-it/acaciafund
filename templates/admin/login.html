{% extends "admin/base.html" %}
{% block admin_content %}
<style>
  .admin-sidebar { display: none; }
</style>
<div style="max-width:400px;margin:4rem auto">
  <h1 style="text-align:center;margin-bottom:1.5rem">Admin Login</h1>
  <form method="POST" style="display:flex;flex-direction:column;gap:1rem">
    <input type="text" name="username" placeholder="Username" autocomplete="username" required>
    <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit" style="padding:0.6rem;border-radius:6px;border:none;background:var(--color-accent,#818cf8);color:#fff;font-weight:600;cursor:pointer">Login</button>
  </form>
  <p class="text-xs mt-4" style="color:var(--color-text-muted);text-align:center">Protected by Cloudflare Access. Contact admin for credentials.</p>
</div>
{% endblock %}
