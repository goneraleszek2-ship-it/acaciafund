{% extends "admin/base.html" %}
{% block title %}Gallery{% endblock %}
{% block content %}
<script>
// Gallery data from template
const galleryTotalItems = {{ stats_total_images }} || 0;
</script>
<div class="page-header">
  <h1>Image Gallery</h1>
  <div class="subtitle">{{ stats_total_images }} images · {{ stats_orphan_images }} orphan</div>
</div>

<form id="gallery-filters" class="filters-bar" onsubmit="return false">
  <label>Type</label>
  <select name="type">
    <option value="">All</option>
    <option value="blog">Blog</option>
    <option value="learn">Learn</option>
    <option value="knowledge">Knowledge</option>
  </select>

  <label>Pillar</label>
  <select name="pillar">
    <option value="">All</option>
    <option value="aml">AML</option>
    <option value="stock">Stock</option>
    <option value="data-engineering">Data Engineering</option>
    <option value="science">Science</option>
  </select>

  <label>Tag</label>
  <select name="tag">
    <option value="">All</option>
  </select>

  <label>Source</label>
  <select name="source">
    <option value="">All</option>
    <option value="unsplash">Unsplash</option>
    <option value="pexels">Pexels</option>
    <option value="pixabay">Pixabay</option>
    <option value="openverse">Openverse</option>
    <option value="wikimedia">Wikimedia</option>
    <option value="loc">LOC</option>
    <option value="nasa">NASA</option>
    <option value="curated">Curated</option>
    <option value="ai_generated">AI Generated</option>
    <option value="manifest">Manifest</option>
    <option value="svgs">SVG Fallbacks</option>
  </select>

  <label>Section</label>
  <select name="section">
    <option value="">All</option>
    <option value="0">0 — Overview</option>
    <option value="1">1 — Key Findings</option>
    <option value="2">2 — Applied Scenario</option>
    <option value="3">3 — Source Analysis</option>
    <option value="4">4 — Domain Breakdown</option>
    <option value="5">5 — Cross-Pillar</option>
    <option value="6">6 — Methodology</option>
  </select>

  <label>Status</label>
  <select name="status">
    <option value="">All</option>
    <option value="used">In use</option>
    <option value="orphan">Orphan</option>
  </select>

  <input type="search" name="q" placeholder="Search filename or article..." style="flex:1;min-width:150px">
</form>

<div id="gallery-grid" class="gallery-grid">
  <div class="empty-state"><div class="spinner" style="margin:0 auto 12px"></div><p>Loading gallery...</p></div>
</div>

<div id="gallery-pagination" class="pagination" style="display:none">
  <button id="page-prev" class="btn btn-sm" onclick="galleryPrev()">← Prev</button>
  <span id="page-info" class="page-info"></span>
  <button id="page-next" class="btn btn-sm" onclick="galleryNext()">Next →</button>
</div>

<!-- Tag editor modal -->
<div id="tag-modal" class="modal-overlay">
  <div class="modal-dialog" style="max-width:400px">
    <div class="modal-header"><h3>Edit Tags</h3><button class="modal-close" onclick="closeTagModal()">&times;</button></div>
    <div class="modal-body">
      <input type="hidden" id="tag-path" value="">
      <div style="margin-bottom:12px;font-size:13px;color:var(--admin-text-secondary)" id="tag-filename"></div>
      <div id="tag-list" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;min-height:32px"></div>
      <div style="display:flex;gap:6px">
        <input type="text" id="tag-input" placeholder="Add tag..." style="flex:1;padding:6px 10px;border:1px solid var(--admin-border);border-radius:6px;font-size:13px">
        <button onclick="addTag()" class="btn btn-sm">Add</button>
      </div>
      <div id="tag-suggestions" style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px"></div>
    </div>
  </div>
</div>
{% endblock %}
