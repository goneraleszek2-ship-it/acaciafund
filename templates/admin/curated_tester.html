{% extends "admin/base.html" %}
{% block admin_content %}
<h1 style="margin-bottom:1.5rem">Curated Tester</h1>

<p class="text-sm mb-4" style="color:var(--color-text-secondary)">{{ curated_count }} curated entries</p>

{% if curated_entries %}
<div class="overflow-x-auto">
  <table class="w-full text-xs" style="color:var(--color-text)">
    <thead>
      <tr style="border-bottom:1px solid var(--color-border)">
        <th class="text-left py-2 pr-4 font-semibold">Slug</th>
        <th class="text-left py-2 font-semibold">Status</th>
      </tr>
    </thead>
    <tbody>
      {% for key, entry in curated_entries %}
      <tr style="border-bottom:1px solid var(--color-border)">
        <td class="py-1.5 pr-4 font-mono">{{ key }}</td>
        <td class="py-1.5">
          <span class="px-1.5 py-0.5 rounded text-[10px]" style="background:var(--color-bg);color:var(--color-text-muted)">curated</span>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% else %}
<p style="color:var(--color-text-muted)">No curated entries found.</p>
{% endif %}
{% endblock %}
