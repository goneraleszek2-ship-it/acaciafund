{% extends "layout.j2" %}
{% block main_content %}
<section class="admin-quality">
  <h1>Quality Statistics</h1>
  <div class="quality-stats">
    <p>Total Scores: {{ stats_total_scores }}</p>
    <p>Average Score: {{ stats_avg_score }}</p>
    <p>Median Score: {{ stats_median_score }}</p>
    <p>Above 70: {{ stats_above_70 }}</p>
    <p>Below 40: {{ stats_below_40 }}</p>
  </div>
</section>
{% endblock %}
