<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Admin{% endblock %} — AcaciaFund</title>
<link rel="stylesheet" href="/static/admin.css">
<script>
// Simple client-side auth check
const AUTH_CHECKED = sessionStorage.getItem('admin_auth') === 'true';
if (!AUTH_CHECKED && window.location.pathname !== '/admin/login' && !window.location.pathname.startsWith('/admin/login')) {
    window.location.href = '/admin/login';
}
</script>
</head>
<body>
<button id="sidebar-toggle" class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Toggle sidebar">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M3 12h18M3 6h18M3 18h18"/>
  </svg>
</button>
<nav class="sidebar" id="sidebar">
<div class="sidebar-header">
  <button class="sidebar-close" onclick="toggleSidebar()" aria-label="Close sidebar">&times;</button>
  <strong>AcaciaFund</strong> Admin
</div>
  <div class="sidebar-nav">
    <a href="." class="{{ 'active' if active_page == 'dashboard' else '' }}">
      <span class="icon">📊</span> Dashboard
    </a>
    <a href="gallery" class="{{ 'active' if active_page == 'gallery' else '' }}">
      <span class="icon">🖼</span> Gallery
    </a>
    <a href="articles" class="{{ 'active' if active_page == 'articles' else '' }}">
      <span class="icon">📝</span> Articles
    </a>
    <a href="manifest" class="{{ 'active' if active_page == 'manifest' else '' }}">
      <span class="icon">📄</span> Manifest
    </a>
    <a href="pipeline" class="{{ 'active' if active_page == 'pipeline' else '' }}">
      <span class="icon">📈</span> Pipeline
    </a>
    <a href="quality" class="{{ 'active' if active_page == 'quality' else '' }}">
      <span class="icon">🎯</span> Quality
    </a>
    <a href="coverage" class="{{ 'active' if active_page == 'coverage' else '' }}">
      <span class="icon">🗺</span> Coverage
    </a>
    <a href="sources" class="{{ 'active' if active_page == 'sources' else '' }}">
      <span class="icon">📡</span> Sources
    </a>
    <a href="curated-test" class="{{ 'active' if active_page == 'curated' else '' }}">
      <span class="icon">🧪</span> Curated Tester
    </a>
  </div>
  <div style="padding:12px 16px;font-size:11px;color:rgba(255,255,255,.3);border-top:1px solid rgba(255,255,255,.06)">
    {{ image_count }} images · {{ article_count }} articles
  </div>
</nav>
<div class="main">
  {% block content %}{% endblock %}
</div>
<div class="toast-container"></div>

<!-- Image Picker Modal -->
<div class="modal-overlay" id="image-picker-modal">
  <div class="modal">
    <div class="modal-header">
      <span>Pick an Image</span>
      <button class="modal-close">&times;</button>
    </div>
    <div class="modal-body">
      <div class="empty-state"><p>Loading...</p></div>
    </div>
  </div>
</div>

<script src="/static/admin.js"></script>
<script>
// Logout function
function logout() {
    sessionStorage.removeItem('admin_auth');
    window.location.href = 'login';
}
</script>
<div style="position:fixed;bottom:10px;right:10px;">
    <button onclick="logout()" style="padding:8px 16px;background:#dc3545;color:white;border:none;border-radius:4px;cursor:pointer;">Logout</button>
</div>
{% block extra_js %}{% endblock %}
</body>
</html>
