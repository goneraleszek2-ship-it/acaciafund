{%- if featured_image %}
<figure class="my-6 rounded-lg overflow-hidden" style="background:var(--color-bg);border:1px solid var(--color-border)">
  <img src="{{ featured_image }}" alt="{{ image_alt | default('') }}"
       width="1200" height="675" loading="lazy"
       class="w-full h-auto object-cover">
  {%- if image_credit %}
  <figcaption class="px-3 py-1.5 text-xs" style="color:var(--color-text-muted);border-top:1px solid var(--color-border)">
    {{ image_credit }}
  </figcaption>
  {%- endif %}
</figure>
{%- endif %}
