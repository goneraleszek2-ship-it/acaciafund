{% if featured_image_url %}
{% set base = featured_image_url.rsplit('.', 1)[0] %}
{% set ext = featured_image_url.rsplit('.', 1)[1] %}
{% set src_400 = base ~ '_400w.' ~ ext %}
{% set src_800 = base ~ '_800w.' ~ ext %}
<img src="{{ featured_image_url }}"
     srcset="{{ src_400 }} 400w, {{ src_800 }} 800w, {{ featured_image_url }} 1200w"
     sizes="(max-width: 400px) 400px, (max-width: 800px) 800px, 1200px"
     alt="{{ title | striptags }}" width="1200" height="675" class="article-featured-image" loading="lazy" decoding="async">
{% else %}
<div class="placeholder-image" style="background:var(--color-bg);border:1px solid var(--color-border);height:400px;display:flex;align-items:center;justify-content:center;color:var(--color-text-muted)">
  <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
  </svg>
</div>
{% endif %}
