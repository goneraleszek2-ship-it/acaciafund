<dialog id="search-palette" class="search-palette">
  <div class="search-palette-inner">
    <div class="search-palette-header">
      <svg class="w-5 h-5" style="color:var(--color-text-muted)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input id="palette-input" type="search" autocomplete="off" placeholder="Search articles, lessons, knowledge…" class="search-palette-input" aria-label="Search">
      <kbd class="search-palette-hint">ESC</kbd>
    </div>
    <div id="palette-results" class="search-palette-results">
      <p class="text-sm py-8 text-center" style="color:var(--color-text-muted)">Type at least 2 characters to search.</p>
    </div>
  </div>
</dialog>
