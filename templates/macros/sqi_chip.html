{% macro sqi_chip(score, scale=1000) -%}
  {%- if score is defined and score is not none and score != 0.0 %}
  {%- if scale == 100 %}
    {%- set display = "%.0f"|format(score) %}
  {%- else %}
    {%- set display = "%.3f"|format(score) %}
  {%- endif %}
  <span class="badge badge-accent" title="Signal Quality Index — composite metric of source authority, freshness, consensus, and relevance.">
    SQI {{ display }}
  </span>
  {%- endif %}
{%- endmacro %}
