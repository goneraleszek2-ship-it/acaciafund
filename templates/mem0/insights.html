<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insights - Mem0</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --text-muted: #94a3b8; --accent: #6366f1; --border: #334155; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 2rem; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { margin-bottom: 2rem; }
        .insight { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; }
        .insight h3 { margin-bottom: 0.5rem; color: var(--accent); }
        .insight p { color: var(--text-muted); margin-bottom: 0.5rem; }
        .insight .tags { margin-top: 1rem; }
        .tag { display: inline-block; background: var(--accent); color: white; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.8rem; margin-right: 0.3rem; }
        .timestamp { color: var(--text-muted); font-size: 0.85rem; }
        .nav { margin-bottom: 1.5rem; }
        .nav a { color: var(--text-muted); text-decoration: none; margin-right: 1.5rem; }
        .nav a:hover, .nav a.active { color: var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <h1>💡 Insights</h1>
        <div class="nav">
            <a href="/mem0/">Dashboard</a>
            <a href="/mem0/deployments">Deployments</a>
            <a href="/mem0/insights" class="active">Insights</a>
            <a href="/mem0/sessions">Sessions</a>
        </div>
        
        {% for i in insights %}
        <div class="insight">
            <h3>{{ i.title or 'No title' }}</h3>
            <p>{{ i.content }}</p>
            <div class="tags">
                <span class="tag">{{ i.insight_type }}</span>
                {% if i.tags %}
                    {% for tag in i.tags.split(',') %}
                    <span class="tag">{{ tag }}</span>
                    {% endfor %}
                {% endif %}
            </div>
            <div class="timestamp">{{ i.created_at }}</div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
