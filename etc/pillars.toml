aml.fincen = { url = "https://www.fincen.gov", name = "FinCEN", frequency = "daily", relevance = 0.9, description = "US Financial Crimes Enforcement Network — SAR filings, advisories, BSA guidance" }
aml.ofac = { url = "https://ofac.treasury.gov", name = "OFAC", frequency = "daily", relevance = 0.9, description = "US Office of Foreign Assets Control — sanctions lists, enforcement actions" }
aml.ecb = { url = "https://www.ecb.europa.eu", name = "ECB", frequency = "weekly", relevance = 0.8, description = "European Central Bank — AML/CFT policies for the euro area" }
aml.fca = { url = "https://www.fca.org.uk", name = "FCA", frequency = "weekly", relevance = 0.8, description = "UK Financial Conduct Authority — AML supervision and enforcement" }
