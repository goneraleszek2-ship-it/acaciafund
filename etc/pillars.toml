stock.values = ["LOB", "Market Microstructure", "Volatility", "Hawkes Process", "VPIN", "Supply Chain", "Earnings", "Commodity", "Portfolio", "Factor Investing", "Risk Parity", "Technical Analysis", "Macro Analysis", "Corporate Finance", "Asset Pricing", "Derivatives", "Stochastic Calculus", "Time Series", "Market Efficiency", "Behavioral Finance", "CAPM", "Options", "Fixed Income", "ESG", "Merger Arbitrage", "Event Study", "Cross-Sectional Momentum", "Machine Learning Finance"]

