[pillars]
aml.label = "Compliance"
aml.emoji = "🛡️"
aml.folder = "content/aml"
aml.tags = ["aml", "anti-money-laundering", "compliance"]
aml.description = "Compliance, anti-money laundering, financial crime detection, and regulatory best practices"
aml.keywords = ["aml", "kyc", "compliance", "regulations", "financial crime"]
aml.domain_scores = { "aml" = 1.0, "compliance" = 0.9, "regulations" = 0.85 }

data-engineering.label = "Data Engineering"
data-engineering.emoji = "📊"
data-engineering.folder = "content/data-engineering"
data-engineering.tags = ["data-engineering", "pipelines", "etl", "data-warehousing"]
data-engineering.description = "Data engineering patterns, tools, and architecture"
data-engineering.keywords = ["data", "pipelines", "etl", "warehousing", "analytics"]
data-engineering.domain_scores = { "data" = 1.0, "pipelines" = 0.95, "etl" = 0.9 }

stock.label = "Markets"
stock.emoji = "📈"
stock.folder = "content/stock"
stock.tags = ["markets", "trading", "finance", "quantitative"]
stock.description = "Market microstructure, trading strategies, financial analysis, and quantitative methods"
stock.keywords = ["markets", "trading", "finance", "quantitative", "risk"]
stock.domain_scores = { "markets" = 1.0, "trading" = 0.95, "finance" = 0.9 }

docs.label = "Documentation"
docs.emoji = "📚"
docs.folder = "content/docs"
docs.tags = ["docs", "documentation", "guides", "reference"]
docs.description = "Technical documentation and reference materials"
docs.keywords = ["docs", "documentation", "guides", "reference", "api"]
docs.domain_scores = { "docs" = 1.0, "documentation" = 0.95, "api" = 0.8 }

[domain_taxonomy]
technical = ["python", "javascript", "sql", "docker", "kubernetes", "aws", "azure", "gcp"]
concepts = ["architecture", "design", "patterns", "best-practices", "optimization"]
tools = ["pandas", "numpy", "scikit-learn", "tensorflow", "pytorch", "langchain", "crewai"]

[entities]
aml.values = ["AML", "KYC", "CDD", "EDD", "PEP", "SANCTIONS", "FATF", "FINTRAC", "FIU", "SAR", "CTR", "BSA", "DPA", "GDPR", "MiFID II", "Basel III", "VASP", "Travel Rule", "Beneficial Ownership", "Shell Company", "Adverse Media", "Watchlist Screening", "Entity Resolution", "Trade-Based ML", "Correspondent Banking", "OFAC", "UNSCR", "MLRO", "STR", "Narrative Generation", "AI Surveillance", "Network Analysis"]

